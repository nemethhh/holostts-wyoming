[project]
name = "holostts-wyoming"
version = "0.1.0"
description = "Wyoming text-to-speech server for Ukrainian with HolosTTS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "wyoming==1.11.0",
    "holos-tts-onnx==0.4",
    "onnxruntime>=1.28",
    "numpy>=1.24",
    "marisa-trie>=1.2",
    "num2words==0.5.14",
    "ipa-uk @ git+https://github.com/patriotyk/ipa-uk@3faf05ec50fd4880965b6c76f8e479a4f82117f5",
    "zeroconf>=0.132",
]

[project.scripts]
holostts-wyoming = "holostts_wyoming.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# holos-tts-onnx pulls the CUDA build on Linux and the hub client; we load local CPU bundles
override-dependencies = [
    "onnxruntime-gpu; sys_platform == 'never'",
    "huggingface-hub; sys_platform == 'never'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
