name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the add-on version
        run: |
          version=$(sed -n 's/^version: *//p' holostts/config.yaml)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, config.yaml $version"; exit 1; }

  addon:
    needs: version
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - id: base
        run: |
          echo "image=$(sed -n 's/^ *${{ matrix.arch }}: *//p' holostts/build.yaml)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: holostts/Dockerfile
          build-args: BUILD_FROM=${{ steps.base.outputs.image }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-holostts:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-addon-holostts:latest

  cuda:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          # GTX 10xx and newer
          - suffix: ""
            base: nvidia/cuda:12.6.3-cudnn-runtime-ubuntu24.04
            ort: 1.20.0
          # RTX 20xx and newer
          - suffix: -cuda13
            base: nvidia/cuda:13.0.3-cudnn-runtime-ubuntu24.04
            ort: 1.32.0
    steps:
      - name: Free disk space for the CUDA base image
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cuda
          build-args: |
            CUDA_BASE=${{ matrix.base }}
            ORT_GPU=${{ matrix.ort }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/holostts-wyoming:${{ steps.v.outputs.version }}${{ matrix.suffix }}
            ghcr.io/${{ github.repository_owner }}/holostts-wyoming:latest${{ matrix.suffix }}

  vulkan:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.vulkan
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/holostts-wyoming:${{ steps.v.outputs.version }}-vulkan
            ghcr.io/${{ github.repository_owner }}/holostts-wyoming:latest-vulkan
