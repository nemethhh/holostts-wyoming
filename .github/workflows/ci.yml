name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Models
        uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('Makefile') }}
      - name: Test
        run: make test
